      // ---- build 40 tabs deterministically ----
      var SITES = [

        ["google-calendar", "Calendar"],
        ["youtube", "YouTube"],

      var ORDER = [0, 1, 2, 3, 4, 5, 6, 7, 2, 0, 4, 1, 3, 6, 5, 7, 2, 1, 0, 4,
                   6, 2, 3, 5, 1, 7, 0, 2, 4, 6, 1, 3, 5, 0, 2, 7, 4, 1, 6, 2];
      var tabsEl = $(".hook01-tabs");
      ORDER.forEach(function (idx) {
        var s = SITES[idx];
        var tab = document.createElement("div");
        tab.className = "hook01-tab";
        tab.innerHTML =
          '<div class="hook01-pill"><img src="assets/favicons/' + s[0] + '.png" alt="">' +
          '<span class="hook01-title">' + s[1] + "</span></div>";

      var tabs = $$(".hook01-tab");
      var pills = $$(".hook01-pill");

      var tl = gsap.timeline({ paused: true });
      var EASE = "power3.out";

      // per-word rise, blur-to-sharp
      function rise(words, at, stagger) {
        tl.fromTo(words,
          { opacity: 0, y: 44, filter: "blur(8px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: EASE, stagger: stagger },
          at);
      }

      // tab arrivals: grow into the flex row (others compress), slide in from right
      function addTabs(from, to, at, stagger, maxW) {
        for (var i = from; i < to; i++) {
          var t = at + (i - from) * stagger;
          tl.fromTo(tabs[i], { maxWidth: 0 }, { maxWidth: maxW, duration: 0.45, ease: EASE }, t);
          tl.fromTo(pills[i], { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.45, ease: EASE }, t);
        }
      }

      // ---- Scene 1 (0.0–1.0): "Forty tabs." + strip + 8 tabs ----
      tl.fromTo($(".hook01-lines"), { y: 150 }, { y: 150, duration: 0.01 }, 0);
      rise($$(".hook01-l1 .hook01-w"), 0.0, 0.08);
      tl.fromTo($(".hook01-l2"), { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
      tl.fromTo($(".hook01-l3"), { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
      tl.fromTo($(".hook01-strip"), { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.5, ease: EASE }, 0.0);
      addTabs(0, 8, 0.1, 0.09, 200);

      // ---- Scene 2 (1.0–2.0): "Twelve logins." + 20 tabs ----
      tl.set($(".hook01-l2"), { opacity: 1 }, 1.0);
      rise($$(".hook01-l2 .hook01-w"), 1.0, 0.08);
      tl.to($(".hook01-l1"), { color: "#9A9A9A", duration: 0.5, ease: EASE }, 1.0);
      tl.to($(".hook01-lines"), { y: 80, duration: 0.7, ease: EASE }, 1.0);
      addTabs(8, 20, 1.02, 0.07, 200);

      // ---- Scene 3 (2.0–3.5): third line, overload to 40 tabs, hold ----
      tl.set($(".hook01-l3"), { opacity: 1 }, 2.0);
      rise($$(".hook01-l3 .hook01-w"), 2.0, 0.06);
      tl.to($(".hook01-l1"), { color: "#D2D2D2", duration: 0.5, ease: EASE }, 2.0);
      tl.to($(".hook01-l2"), { color: "#9A9A9A", duration: 0.5, ease: EASE }, 2.0);
      tl.to($(".hook01-lines"), { y: 0, duration: 0.7, ease: EASE }, 2.0);
      tl.to($$(".hook01-title"), { opacity: 0, duration: 0.3, ease: EASE }, 2.0);
      addTabs(20, 40, 2.02, 0.045, 200);

      // ---- Scene 4 (3.5): hard clear — discrete cut, then the question ----
      tl.set($(".hook01-grind"), { opacity: 1 }, 0);
      tl.set($(".hook01-grind"), { opacity: 0 }, 3.5);
      tl.set($(".hook01-q"), { opacity: 1 }, 3.5);
      rise($$(".hook01-q1 .hook01-w"), 3.5, 0.08);

      window.__timelines = window.__timelines || {};
