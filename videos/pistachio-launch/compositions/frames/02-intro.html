    (function () {

      var mark = $("mark");
      var word = $("word");
      var chip = $("chip");
      var sub = $("sub");
      var words = Array.prototype.slice.call($("tagline").querySelectorAll(".w"));

      // Fixed lockup geometry (wordmark box has a fixed CSS width, so no font-load measuring).
      var mover = $("mover");
      var MARK_W = 150;

      var tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0–0.6): rounded card holding the wallpaper blooms to full-bleed.
      tl.fromTo(stage,
        { clipPath: "inset(378px 672px 378px 672px round 28px)" },
        { clipPath: "inset(0px 0px 0px 0px round 0px)", duration: 0.6, ease: "expo.out" }, 0);
      // Wallpaper counter-scales 1.25 -> 1.06 so the waves unfold ...
      tl.fromTo(wallpaper, { scale: 1.25, opacity: 1 }, { scale: 1.06, opacity: 1, duration: 0.6, ease: "expo.out" }, 0);
      // ... then drifts imperceptibly 1.06 -> 1.0, decelerating to rest exactly at the cut (handoff_out).
      tl.to(wallpaper, { scale: 1.0, duration: 5.4, ease: "sine.out" }, 0.6);

      // Scene 2 (0.5–2.0): mark springs in at dead center, then slides left as the wordmark wipes out from behind it.
      // mover spans the lockup: xPercent 50 + x -75 centers the mark on the frame's center line.

      tl.fromTo(mark,
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.6, ease: "expo.out" }, 0.5);
      tl.to(mover, { xPercent: 0, x: 0, duration: 0.8, ease: "power3.inOut" }, 1.1);

        { xPercent: -45, opacity: 0, filter: "blur(8px)", clipPath: "inset(-20% 100% -20% 0%)" },
        { xPercent: 0, opacity: 1, filter: "blur(0px)", clipPath: "inset(-20% 0% -20% 0%)", duration: 0.85, ease: "power3.inOut" }, 1.1);

      // Scene 3 (2.0–3.5): tagline rises per-word. Word offsets are pre-computed from content length

      words.forEach(function (w) { starts.push(t); t += BASE + w.textContent.length * PER_CHAR; });

          { y: 44, opacity: 0, filter: "blur(8px)" },
          { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.7, ease: "power3.out" }, starts[i]);

      tl.set({}, {}, 6.0);
