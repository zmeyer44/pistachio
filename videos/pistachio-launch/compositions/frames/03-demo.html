<script>
(function () {
  var P = "03-demo-";
  var $ = function (n) { return document.getElementsByClassName(P + n)[0]; };
  var $$ = function (n) { return Array.prototype.slice.call(document.getElementsByClassName(P + n)); };
  var tl = gsap.timeline({ paused: true });

  var PANEL_W = 430;
  var ROW_H = 64;
  var STEP_H = 52;

  /* ---------- deterministic typing schedules ---------- */
  function schedule(text, start, dur) {
    var w = [];
    for (var i = 0; i < text.length; i++) {
      var c = text.charAt(i);
      var k = (c === " ") ? 1.7 : (c === "," || c === "." || c === "—") ? 3.0 : 1 + ((text.charCodeAt(i) * 37) % 7) / 14;
      w.push(k);
    }
    var sum = 0; for (var j = 0; j < w.length; j++) sum += w[j];
    var acc = 0, out = [];
    for (var m = 0; m < w.length; m++) { acc += w[m]; out.push(start + (acc / sum) * dur); }
    return out;
  }
  function countAt(times, t) { var n = 0; while (n < times.length && times[n] <= t) n++; return n; }

  var PROMPT = "Reply to the top email saying I’ll be ten minutes late, then archive it.";
  var REPLY = "Running about ten minutes late — start without me, I’ll catch up.";
  var T_PROMPT = schedule(PROMPT, 2.62, 2.66);   // done ~5.28
  var T_REPLY = schedule(REPLY, 8.75, 1.5);      // done ~10.25

  var typed = $("typed"), caret = $("pcaret"), ph = $("ph"), sendbtn = $("sendbtn");
  var rtyped = $("rtyped"), rcaret = $("rcaret");
  var stext = $("stext"), sdot = $("sdot"), scheck = $("scheck"), cnt = $("cnt");
  var inboxtab = $("inboxtab"), ctxname = $("ctxname");

  function blinkOn(t, since) { return Math.sin((t - since) * Math.PI * 2 / 1.05 + Math.PI / 2) > -0.2; }

  var last = {};
  function setText(el, key, v) { if (last[key] !== v) { el.textContent = v; last[key] = v; } }
  function setStyle(el, prop, key, v) { if (last[key] !== v) { el.style[prop] = v; last[key] = v; } }

  function render(t) {
    // composer prompt
    var n = (t >= 2.6 && t < 5.56) ? countAt(T_PROMPT, t) : 0;
    setText(typed, "typed", PROMPT.slice(0, n));
    setStyle(ph, "opacity", "ph", (t >= 2.6 && t < 5.56) ? "0" : "1");
    var cOn = false;
    if (t >= 2.5 && t < 5.56) {
      var lastKey = n > 0 ? T_PROMPT[n - 1] : 2.5;
      cOn = (t - lastKey < 0.3 && n < PROMPT.length) ? true : blinkOn(t, lastKey);
    }
    setStyle(caret, "opacity", "caret", cOn ? "1" : "0");
    var active = n > 0;
    setStyle(sendbtn, "background", "sbg", active ? "#52A862" : "#EDEDED");
    setStyle(sendbtn, "color", "sfg", active ? "#FFFFFF" : "#A3A3A3");

    // reply box
    var rn = t >= 8.7 ? countAt(T_REPLY, t) : 0;
    setText(rtyped, "rtyped", REPLY.slice(0, rn));
    var rOn = false;
    if (t >= 8.62 && t < 11.3) {
      var lk = rn > 0 ? T_REPLY[rn - 1] : 8.62;
      rOn = (t - lk < 0.3 && rn < REPLY.length) ? true : blinkOn(t, lk);
    }
    setStyle(rcaret, "opacity", "rcaret", rOn ? "1" : "0");

    // status
    var working = t >= 5.56 && t < 12.2;
    setText(stext, "stext", working ? "Working…" : "Ready");
    setStyle(scheck, "display", "sck", t >= 12.2 ? "block" : "none");
    setStyle(sdot, "display", "sdd", t >= 12.2 ? "none" : "block");
    var dotOp = working ? (0.35 + 0.65 * (0.5 + 0.5 * Math.cos((t - 5.56) * Math.PI * 2 / 1.0))) : 1;
    sdot.style.opacity = dotOp.toFixed(3);
    sdot.style.background = working ? "#52A862" : "#7FC18B";

    // counter + tab title
    setText(cnt, "cnt", t >= 11.0 ? "3 actions" : t >= 8.5 ? "2 actions" : "1 action");
    var inb = t >= 11.95 ? "Inbox (2)" : "Inbox (3)";
    setText(inboxtab, "inb", inb);
    setText(ctxname, "ctx", inb);
  }

  var clock = { t: 0 };
  tl.fromTo(clock, { t: 0 }, { t: 16, duration: 16, ease: "none", onUpdate: function () { render(clock.t); } }, 0);
  render(0);

  /* ---------- Scene 1: window rises (0.0–1.5) ---------- */
  tl.fromTo($("win"), { y: 60, scale: 0.96, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 1.1, ease: "power3.out" }, 0.0);

  /* ---------- Scene 2: ⌘ I keycaps + panel opens (1.5–2.5) ---------- */
  tl.fromTo([$("k1"), $("k2")], { y: 24, scale: 0.92, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.3, ease: "power3.out", stagger: 0.05 }, 1.28);
  tl.to([$("k1"), $("k2")], { y: 5, scale: 0.965, duration: 0.09, ease: "power2.in" }, 1.5);
  tl.to([$("k1"), $("k2")], { y: 0, scale: 1, duration: 0.22, ease: "power3.out" }, 1.62);
  tl.to([$("k1"), $("k2")], { y: -10, opacity: 0, duration: 0.3, ease: "power2.in" }, 2.08);

  // anchored-layout-expand, X axis: one proxy drives panel slide + pane right edge + pane right-anchored content
  var paneEl = $("pane"), panelEl = $("panel"), rightEls = $$("r");
  var open = { p: 0 };
  function applyOpen() {
    var d = PANEL_W * open.p;
    gsap.set(panelEl, { x: PANEL_W - d });
    paneEl.style.clipPath = "inset(0px " + d.toFixed(2) + "px 0px 0px round 12px)";
    gsap.set(rightEls, { x: -d });
  }
  tl.fromTo(open, { p: 0 }, { p: 1, duration: 0.6, ease: "power3.out", onUpdate: applyOpen }, 1.56);
  applyOpen();

  /* ---------- Scene 3: camera eases in on the panel (2.5–5.5) ---------- */
  var cam = $("cam");
  gsap.set(cam, { transformOrigin: "0px 0px" });
  tl.fromTo(cam, { x: 0, y: 0, scale: 1 }, { x: -880, y: -352, scale: 1.3, duration: 1.0, ease: "power3.inOut" }, 2.45);

  /* ---------- Scene 4: send (5.5–6.0) ---------- */
  tl.to(sendbtn, { scale: 0.86, duration: 0.08, ease: "power2.in" }, 5.46);
  tl.to(sendbtn, { scale: 1, duration: 0.22, ease: "power3.out" }, 5.54);
  tl.to($("empty"), { opacity: 0, y: -14, duration: 0.28, ease: "power2.out" }, 5.52);
  tl.fromTo($("bubble"), { x: -52, y: 672, opacity: 0 }, { x: 0, y: 0, opacity: 1, duration: 0.6, ease: "expo.out" }, 5.56);
  tl.to(cam, { x: 0, y: 0, scale: 1, duration: 0.85, ease: "power3.inOut" }, 5.56);

  /* ---------- Steps card: proxy counter-scale growth, one row per step ---------- */
  var cmask = $("cmask"), csheet = $("csheet"), cfoot = $("cfoot");
  var BODY_H = STEP_H * 3;
  var grow = { h: 0 };
  function applyGrow() {
    var s = Math.max(grow.h / BODY_H, 0.0001);
    gsap.set(cmask, { scaleY: s });
    gsap.set(csheet, { scaleY: 1 / s });
    gsap.set(cfoot, { y: grow.h - BODY_H });
  }
  tl.fromTo($("card"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 5.92);
  tl.set(grow, { h: 0, onUpdate: applyGrow }, 0);
  tl.to(grow, { h: STEP_H, duration: 0.45, ease: "power3.out", onUpdate: applyGrow }, 6.0);
  tl.to(grow, { h: STEP_H * 2, duration: 0.45, ease: "power3.out", onUpdate: applyGrow }, 8.5);
  tl.to(grow, { h: STEP_H * 3, duration: 0.45, ease: "power3.out", onUpdate: applyGrow }, 11.0);
  applyGrow();

  function stepIn(id, at) {
    var row = $(id);
    var cc = row.getElementsByClassName(P + "cc")[0];
    var cp = row.getElementsByClassName(P + "cp")[0];
    tl.set(row, { opacity: 0, x: 10 }, 0);
    tl.set(cc, { opacity: 0, scale: 0.5, transformOrigin: "50% 50%" }, 0);
    tl.set(cp, { strokeDasharray: 14, strokeDashoffset: 14 }, 0);
    tl.to(row, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, at + 0.04);
    tl.to(cc, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, at + 0.3);
    tl.to(cp, { strokeDashoffset: 0, duration: 0.32, ease: "power2.out" }, at + 0.42);
  }
  stepIn("s1", 6.0);
  stepIn("s2", 8.5);
  stepIn("s3", 11.0);
  tl.set(cnt, { y: 7, opacity: 0.2 }, 8.5);
  tl.to(cnt, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 8.5);
  tl.set(cnt, { y: 7, opacity: 0.2 }, 11.0);
  tl.to(cnt, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 11.0);

  /* ---------- agent highlight (SVG rect attrs — no layout) ---------- */
  var hl = $("hlr");
  tl.fromTo(hl, { attr: { x: 560, y: 114, width: 250, height: 60 }, opacity: 0 },
    { attr: { x: 10, y: 114, width: 802, height: 60 }, opacity: 1, duration: 0.5, ease: "power3.out" }, 6.08);
  // row "press"
  tl.to($("row1"), { backgroundColor: "rgba(82,168,98,0.06)", duration: 0.15, ease: "power1.out" }, 6.6);

  /* Scene 5: open the email view */
  var inbox = $("inbox"), mail = $("mail");
  tl.to(inbox, { opacity: 0, x: -14, duration: 0.18, ease: "power2.in" }, 6.82);
  tl.fromTo(mail, { opacity: 0, x: 18 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 6.98);
  tl.to(hl, { attr: { x: 16, y: 74, width: 790, height: 196 }, duration: 0.5, ease: "power3.inOut" }, 7.0);

  /* Scene 6: reply box */
  tl.to(hl, { attr: { x: 22, y: 294, width: 778, height: 178 }, duration: 0.45, ease: "power3.inOut" }, 8.35);

  /* Scene 7: send + archive */
  tl.to(hl, { attr: { x: 38, y: 412, width: 96, height: 46 }, duration: 0.4, ease: "power3.inOut" }, 10.95);
  tl.to($("send"), { scale: 0.93, duration: 0.08, ease: "power2.in" }, 11.38);
  tl.to($("send"), { scale: 1, duration: 0.2, ease: "power3.out" }, 11.46);
  tl.to(hl, { opacity: 0, duration: 0.18, ease: "power1.out" }, 11.55);
  tl.to(mail, { opacity: 0, x: 14, duration: 0.16, ease: "power2.in" }, 11.55);
  tl.to(inbox, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 11.7);
  tl.set(hl, { attr: { x: 10, y: 114, width: 802, height: 60 } }, 11.74);
  tl.to(hl, { opacity: 1, duration: 0.15, ease: "power1.out" }, 11.75);
  // row collapses out, the rest slide up in contact
  tl.to([$("row1"), hl], { opacity: 0, duration: 0.24, ease: "power2.out" }, 11.9);
  tl.fromTo($("below"), { y: 0 }, { y: -ROW_H, duration: 0.45, ease: "power3.inOut", immediateRender: false }, 11.98);
  // toast
  tl.fromTo($("toastin"), { y: 22, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 12.05);
  tl.fromTo(scheck, { scale: 0.4, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, 12.2);

  /* ---------- Scene 8: window glides right, headline rises (13.0–16.0) ---------- */
  var move = $("move");
  gsap.set(move, { transformOrigin: "960px 524px" });
  tl.to(move, { x: 337, scale: 0.74, duration: 1.1, ease: "power3.inOut" }, 12.5);
  tl.fromTo($("shade"), { opacity: 0 }, { opacity: 1, duration: 0.9, ease: "power2.out" }, 12.95);
  tl.fromTo($$("a"), { y: 30, opacity: 0, filter: "blur(8px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.75, ease: "power3.out", stagger: 0.08 }, 13.0);
  tl.fromTo($$("b"), { y: 30, opacity: 0, filter: "blur(8px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.75, ease: "power3.out", stagger: 0.08 }, 13.5);

  window.__timelines["03-demo"] = tl;
})();
</script>
