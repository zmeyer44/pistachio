    (function () {
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const q = (s) => document.querySelectorAll("#root " + s);
      const one = (id) => document.getElementById(id);

      // ---------- Initial states for the later layout (explicit, seek-safe) ----------
      // (hidden starting states for the later layout are authored in CSS)

      // ---------- Scene 1 (0.0–2.0): per-word rise, blur-to-sharp ----------
      tl.fromTo(q(".m05-moves-hw1"),
        { y: 44, opacity: 0, filter: "blur(8px)" },
        { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.7, ease: "power3.out", stagger: 0.09 },
        0.0);
      tl.fromTo(q(".m05-moves-hw2"),
        { y: 44, opacity: 0, filter: "blur(8px)" },
        { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.7, ease: "power3.out", stagger: 0.09 },
        0.8);

      // ---------- Scene 2 (2.0): scale-swap — headline out, layout in ----------
      // Outgoing: fast power2.in rush away, finishes right as the layout lands on 2.0
      tl.fromTo("#m05-moves-headline",
        { y: 0, scale: 1, opacity: 1, filter: "blur(0px)" },
        { y: -70, scale: 0.8, opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" },
        1.7);
      // Incoming (brand: no bounce — expo.out settle instead of back.out)
      tl.fromTo("#m05-moves-panel",
        { opacity: 0, scale: 0.94, y: 30 },
        { opacity: 1, scale: 1, y: 0, duration: 0.9, ease: "expo.out" },
        1.98);
      tl.fromTo("#m05-moves-window",
        { y: 40, scale: 0.96 },
        { y: 0, scale: 1, duration: 1.0, ease: "expo.out" },
        2.02);
      tl.set("#m05-moves-left", { opacity: 1 }, 1.98);
      tl.fromTo("#m05-moves-ticker",
        { opacity: 0, y: 40, filter: "blur(8px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.8, ease: "power3.out" },
        2.0);
      tl.fromTo("#m05-moves-rule",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.7, ease: "power3.out" },
        2.2);
      // inner content reveals after the container settles
      tl.fromTo("#m05-moves-copy0 .m05-moves-title",
        { opacity: 0, y: 30, filter: "blur(8px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: "power3.out" },
        2.25);
      tl.fromTo("#m05-moves-copy0 .m05-moves-sub",
        { opacity: 0, y: 24, filter: "blur(8px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: "power3.out" },
        2.4);

      // ---------- Numeral ticker: additive steps 02→03→04→05 on 4.0 / 6.0 / 8.0 ----------
      const ITEM_H = 220;
      const SWAPS = [4.0, 6.0, 8.0];
      // Seek-safe: tween the stack's own y (baseline set at 0), no onUpdate proxies.
      tl.set("#m05-moves-stack", { y: 0 }, 0);
      SWAPS.forEach(function (T, i) {
        tl.fromTo("#m05-moves-stack",
          { y: -i * ITEM_H },
          { y: -(i + 1) * ITEM_H, duration: 0.75, ease: "expo.out", immediateRender: false },
          T - 0.08);
      });

      // ---------- Title/sub + screenshot swaps ----------
      SWAPS.forEach(function (T, i) {
        const outC = "#m05-moves-copy" + i;
        const inC = "#m05-moves-copy" + (i + 1);
        // outgoing copy: up-and-out
        tl.fromTo(outC,
          { y: 0, opacity: 1, filter: "blur(0px)" },
          { y: -36, opacity: 0, filter: "blur(8px)", duration: 0.32, ease: "power2.in", immediateRender: false },
          T - 0.3);
        // incoming copy: up-and-in, blur-to-sharp
        tl.set(inC, { opacity: 1 }, T);
        tl.fromTo(inC + " .m05-moves-title",
          { opacity: 0, y: 36, filter: "blur(8px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: "power3.out" },
          T);
        tl.fromTo(inC + " .m05-moves-sub",
          { opacity: 0, y: 28, filter: "blur(8px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: "power3.out" },
          T + 0.12);

        // screenshot: short horizontal push inside the window
        const outS = "#m05-moves-shot" + i;
        const inS = "#m05-moves-shot" + (i + 1);
        tl.fromTo(outS,
          { x: 0, opacity: 1 },
          { x: -90, opacity: 0.4, duration: 0.7, ease: "power3.inOut", immediateRender: false },
          T - 0.2);
        tl.fromTo(inS,
          { x: 140, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.8, ease: "expo.out" },
          T - 0.08);
        tl.set(outS, { opacity: 0 }, T + 0.72);
      });

      // Hold to the cut (scene 5 settles by ~8.8s; timeline spans the full 10s)
      tl.set({}, {}, 10);

      window.__timelines["05-moves"] = tl;
    })();
