<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <!--
    The hero's wallpaper: an abstract wash in the brand's greens and creams,
    the way a desktop picture sits behind a window. Large soft forms and a
    little grain, nothing a person would read as a picture of something.
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#f1f4ee"/>
      <stop offset="0.55" stop-color="#cfdcc4"/>
      <stop offset="1" stop-color="#9fbf9d"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.72" cy="0.18" r="0.5">
      <stop offset="0" stop-color="#f9f8ef" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#f1f0e4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f3ecd2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="deep" cx="0.18" cy="0.85" r="0.6">
      <stop offset="0" stop-color="#2f6b46" stop-opacity="0.85"/>
      <stop offset="0.6" stop-color="#4f8a5e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4f8a5e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="teal" cx="0.9" cy="0.75" r="0.45">
      <stop offset="0" stop-color="#5aa393" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#5aa393" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blush" cx="0.35" cy="0.3" r="0.4">
      <stop offset="0" stop-color="#dfe3cf" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#e6cfa8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <rect width="1600" height="1000" fill="url(#sun)"/>
  <rect width="1600" height="1000" fill="url(#blush)"/>
  <g filter="url(#soft)">
    <ellipse cx="260" cy="880" rx="620" ry="380" fill="url(#deep)"/>
    <ellipse cx="1420" cy="760" rx="520" ry="360" fill="url(#teal)"/>
    <path d="M-100 760 C 300 620, 620 900, 980 700 S 1500 560, 1750 720 L 1750 1100 L -100 1100 Z" fill="#3b7a52" fill-opacity="0.55"/>
    <path d="M-100 860 C 380 760, 700 980, 1100 820 S 1520 700, 1750 840 L 1750 1100 L -100 1100 Z" fill="#245a3a" fill-opacity="0.6"/>
    <ellipse cx="1120" cy="120" rx="460" ry="220" fill="#f8f9f2" fill-opacity="0.7"/>
  </g>
  <rect width="1600" height="1000" filter="url(#grain)" opacity="0.7"/>
</svg>
