 // Additive translation composes with entry/exit and the stack's CSS scale.

 ${film?`<div class="ss-film" role="img" aria-label="Sample abstract film still"><span class="ss-filmwords"><small>Studio Journal / 04</small>Studies<br>in light.</span><span class="ss-still">SAMPLE STILL</span></div>`:''}
 <div class="ss-card-body">
 <div class="ss-details" inert><div class="ss-seekrow"><input class="ss-seek" type="range" min="0" max="${s.duration}" step="1" value="${s.position}" style="--fill:${s.position/s.duration*100}%" aria-label="Seek ${s.title}"><div class="ss-times"><span class="ss-elapsed">${format(s.position)}</span><span>${format(s.duration)}</span></div></div><div class="ss-actions"><button type="button" class="ss-rate" data-action="speed" aria-label="Playback speed for ${s.title}: ${s.rate}x" aria-haspopup="dialog" aria-expanded="false" aria-controls="ss-speed-dialog"><span class="ss-rate-number" aria-hidden="true">${rateText(s.rate)}</span>${icon('chevron-up')}</button><div class="ss-skip">${button('Back 10 seconds','rotate-ccw','back')}${button('Forward 10 seconds','rotate-cw','forward')}</div>${button(s.muted?'Unmute':'Mute',s.muted?'volume-x':'volume-2','mute')}</div></div>
 <div class="ss-main"><div class="ss-identity"><div class="ss-dismiss" inert>${button('Dismiss '+s.title,'x','dismiss')}</div><button type="button" class="ss-track-select" data-action="details" aria-label="Show controls for ${s.title}" aria-expanded="false"><span class="ss-art-wrap"><span class="ss-art ${s.art}" aria-hidden="true"></span>${badge}</span><span class="ss-meta"><span class="ss-title" style="display:block">${s.title}</span><span class="ss-sub" style="display:block">${s.by}</span></span></button></div>${button(s.playing?'Pause':'Play',s.playing?'pause':'play','play','primary')}</div></div><div class="ss-compact-progress" aria-hidden="true"><span></span></div></article>`;
 }).join('');
 emptyStack();
 popover=document.createElement('div');popover.className='ss-speed';popover.id='ss-speed-dialog';popover.hidden=true;popover.setAttribute('role','dialog');popover.setAttribute('aria-label','Playback speed');
 popover.innerHTML=`<div class="ss-speedhead"><span class="ss-icon" aria-hidden="true">${icon('gauge')}</span><div class="ss-speedvalue"><output class="ss-speed-output" aria-live="off" aria-label="1 times">1×</output><span class="ss-speedlabel">Playback speed</span></div>${button('Reset playback speed to 1x','rotate-ccw','reset-speed')}</div><div class="ss-sliderwrap"><input class="ss-speedslider" type="range" min="0.25" max="2" step="0.25" value="1" aria-label="Playback speed" aria-valuetext="1 times, normal speed"><div class="ss-ticks" aria-hidden="true">${Array.from({length:8},()=>'<span></span>').join('')}</div></div><div class="ss-speedbounds" aria-hidden="true"><span>0.25×</span><span>1×</span><span>2×</span></div>`;
 stack.append(popover);stack.querySelectorAll('.ss-card-body').forEach(body=>body.prepend(body.querySelector('.ss-main')));icons();apply();
 const previous=new Map();
 stack.querySelectorAll('.ss-card').forEach(card=>{const before=previousPositions.get(card.dataset.id);if(before)previous.set(card,before);else enterCard(card);});
 repositionCards(previous);
}
function syncProgress(id){const card=stack.querySelector(`[data-id="${id}"]`);if(!card)return;const s=track(id),fill=Math.min(100,Math.max(0,s.position/s.duration*100))+'%',input=card.querySelector('.ss-seek');card.style.setProperty('--ss-progress',fill);input.value=s.position;input.style.setProperty('--fill',fill);card.querySelector('.ss-elapsed').textContent=format(s.position);}
function syncSpeed(){if(!speedId)return;const s=source(speedId),t=track(speedId),slider=popover.querySelector('input');slider.value=String(s.rate);slider.style.setProperty('--speed-fill',((s.rate-.25)/1.75*100)+'%');slider.setAttribute('aria-valuetext',`${s.rate} times${s.rate===1?', normal speed':''}`);popover.querySelector('output').textContent=rateText(s.rate);popover.querySelector('output').setAttribute('aria-label',`${s.rate} times`);popover.querySelector('.ss-speedlabel').textContent=s.rate===1?'Normal playback speed':'Playback speed';popover.querySelectorAll('.ss-ticks span').forEach((dot,i)=>{dot.classList.toggle('passed',(i+1)/4<s.rate);dot.classList.toggle('current',(i+1)/4===s.rate);});const trigger=stack.querySelector(`[data-id="${speedId}"] .ss-rate`);trigger.querySelector('.ss-rate-number').textContent=rateText(s.rate);trigger.setAttribute('aria-label',`Playback speed for ${t.title}: ${s.rate}x`);}
function positionSpeed(){if(!speedId||popover.hidden)return;const trigger=stack.querySelector(`[data-id="${speedId}"] .ss-rate`),r=trigger.getBoundingClientRect(),st=stack.getBoundingClientRect(),win=root.querySelector('.ss-window').getBoundingClientRect();const h=popover.offsetHeight;let y=r.top-h-8;const below=y<win.top+50;if(below)y=r.bottom+8;y=Math.min(win.bottom-44-h,Math.max(win.top+50,y));popover.style.top=(y-st.top)+'px';popover.style.bottom='auto';popover.dataset.side=below?'below':'above';}
function openSpeed(id){if(speedId===id){closeSpeed(true);return;}if(speedId)closeSpeed(false);speedId=id;suppressed=false;syncExpansion();popover.hidden=false;stack.querySelector(`[data-id="${id}"] .ss-rate`).setAttribute('aria-expanded','true');syncSpeed();positionSpeed();popover.querySelector('input').focus({preventScroll:true});}
function closeSpeed(returnFocus){if(!speedId)return;const id=speedId,trigger=stack.querySelector(`[data-id="${id}"] .ss-rate`);speedId=null;popover.hidden=true;trigger?.setAttribute('aria-expanded','false');if(returnFocus&&trigger){focusId=id;trigger.focus({preventScroll:true});}else if(popover.contains(document.activeElement)){document.activeElement.blur();focusId=null;}syncExpansion();}
function scheduleCollapse(){clearTimeout(closeTimer);closeTimer=setTimeout(()=>{if(!hovered){hoveredId=null;suppressed=false;syncExpansion();}},140);}
function enterStack(e){if(e.pointerType==='touch')return;clearTimeout(closeTimer);hovered=true;suppressed=false;const card=document.elementFromPoint(e.clientX,e.clientY)?.closest('.ss-card');hoveredId=card?.dataset.id||order[0]||null;syncExpansion();}
function leaveStack(e){if(e.pointerType==='touch')return;hovered=false;scheduleCollapse();}
stack.addEventListener('pointerenter',enterStack);
stack.addEventListener('pointerleave',leaveStack);
// Mouse-only event producers (including embedded browser surfaces) also work.
stack.addEventListener('mouseenter',e=>{if(matchMedia('(hover: hover)').matches)enterStack(e);});
stack.addEventListener('mouseleave',e=>{if(matchMedia('(hover: hover)').matches)leaveStack(e);});
let lastPointer=null;
function moveWithinStack(e){if(e.pointerType==='touch'||speedId||dragId)return;const point=[e.clientX,e.clientY];if(lastPointer&&point[0]===lastPointer[0]&&point[1]===lastPointer[1])return;lastPointer=point;const card=e.target.closest('.ss-card');if(!card||leavingCards.has(card))return;hovered=true;suppressed=false;if(hoveredId!==card.dataset.id){hoveredId=card.dataset.id;focusId=null;syncExpansion();}}
// Real pointer motion chooses a card. Layout-driven enter/leave events cannot
// bounce engagement between neighboring cards as their heights animate.
stack.addEventListener('pointermove',moveWithinStack);
stack.addEventListener('mousemove',e=>{if(matchMedia('(hover: hover)').matches)moveWithinStack(e);});
stack.addEventListener('focusin',e=>{if(e.target.matches(':focus-visible')||speedId){focusId=e.target.closest('.ss-card')?.dataset.id||speedId;if(!speedId)hoveredId=null;suppressed=false;syncExpansion();}});
stack.addEventListener('focusout',e=>{if(!e.relatedTarget)return;queueMicrotask(()=>{if(!stack.contains(document.activeElement)){focusId=null;if(speedId)closeSpeed(false);scheduleCollapse();}});});
stack.addEventListener('pointerdown',e=>{if(e.target.matches('input[type=range]')){dragId=e.target.closest('.ss-card')?.dataset.id||speedId;syncExpansion();}});
document.addEventListener('pointerup',()=>{if(dragId){dragId=null;syncExpansion();}});
document.addEventListener('pointercancel',()=>{dragId=null;syncExpansion();});
document.addEventListener('pointerdown',e=>{if(speedId&&!popover.contains(e.target)&&!e.target.closest('.ss-rate'))closeSpeed(false);if(!stack.contains(e.target)){touchId=null;focusId=null;suppressed=false;syncExpansion();}});
stack.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();e.stopPropagation();if(speedId){closeSpeed(true);return;}touchId=null;focusId=null;hovered=false;hoveredId=null;suppressed=true;stack.querySelector('[data-layer="0"] .ss-track-select')?.focus({preventScroll:true});focusId=null;suppressed=true;syncExpansion();}if(e.key==='Tab'&&!speedId){suppressed=false;syncExpansion();}});
root.addEventListener('error',e=>{if(e.target.matches('.ss-favicon img')){e.target.hidden=true;e.target.nextElementSibling.hidden=false;}},true);
root.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.mode){closeSpeed(false);state.mode=b.dataset.mode;hovered=false;hoveredId=null;focusId=null;touchId=null;render();save();return;}
 const action=b.dataset.action;if(action==='restore'){order=['music','podcast','reading'];hovered=false;hoveredId=null;focusId=null;touchId=null;suppressed=false;render();return;}
 if(action==='reset-speed'&&speedId){source(speedId).rate=1;syncSpeed();save();return;}
 const card=b.closest('.ss-card');if(!card)return;const id=card.dataset.id,s=source(id);
 if(action==='details'){touchId=touchId===id?null:id;suppressed=false;syncExpansion();return;}
 if(action==='speed'){openSpeed(id);return;}
 if(action==='dismiss'){dismissCard(card,e.detail===0);return;}
 if(action==='play'){s.playing=!s.playing;b.setAttribute('aria-label',s.playing?'Pause':'Play');b.innerHTML=icon(s.playing?'pause':'play');icons();}
 if(action==='mute'){s.muted=!s.muted;b.setAttribute('aria-label',s.muted?'Unmute':'Mute');b.innerHTML=icon(s.muted?'volume-x':'volume-2');icons();}
 if(action==='back'||action==='forward'){s.position=Math.min(track(id).duration,Math.max(0,track(id).position+(action==='back'?-10:10)));syncProgress(id);}
});
root.addEventListener('input',e=>{const input=e.target;if(input.matches('.ss-speedslider')&&speedId){source(speedId).rate=Number(input.value);syncSpeed();}else if(input.matches('.ss-seek')){const s=source(input.closest('.ss-card').dataset.id);s.position=Number(input.value);syncProgress(s.id);}});
root.addEventListener('change',e=>{if(e.target.matches('.ss-speedslider'))save();});
stack.addEventListener('transitionend',e=>{if(e.propertyName==='height'&&speedId)positionSpeed();});
// Saved-state echoes must not replace a focused slider or interrupt a drag.
window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){const previousMode=state.mode;restore(e.detail.globals.widgetState);if(previousMode!==state.mode)render();else{apply();if(speedId)syncSpeed();}}});
render();new ResizeObserver(layout).observe(root);
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{apply();save();}});tweak.addSelect(state,'theme',{label:'Appearance',options:['system','light','dark']});tweak.addSlider(state,'width',{label:'Sidebar width',min:280,max:360,step:10,unit:'px'});tweak.addToggle(state,'keepOpen',{label:'Keep stack expanded'});}
})();
</script>
