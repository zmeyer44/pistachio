<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: light dark; font: 13px/1.4 -apple-system, system-ui, sans-serif; }
      body { margin: 0; padding: 12px; }
      h1 { font-size: 13px; font-weight: 600; margin: 0 0 8px; opacity: 0.7; }
      ul { list-style: none; margin: 0; padding: 0; }
      li { display: flex; align-items: center; gap: 8px; padding: 6px 0; }
      li img { width: 16px; height: 16px; flex: none; }
      li span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      li.active span { font-weight: 600; }
      button { font: inherit; padding: 2px 8px; }
      p.empty { opacity: 0.6; }
    </style>
  </head>
  <body>
    <h1 id="space">This space</h1>
    <ul id="tabs"></ul>
    <p class="empty" id="empty" hidden>No tabs here.</p>
    <script type="module" src="panel.js"></script>
  </body>
</html>
